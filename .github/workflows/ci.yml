name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy

    - name: Run Ruff linter (sanity gate)
      run: |
        # Keep CI blocking only on high-signal syntax/runtime lint errors.
        ruff check src/ tests/ --output-format=github --select E9,F63,F7,F82

    - name: Run Ruff linter (full report)
      run: |
        ruff check src/ tests/ --output-format=github

    - name: Run Ruff formatter check
      run: |
        ruff format --check src/ tests/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install mypy types-requests

    - name: Run MyPy type checker
      run: |
        mypy --install-types --non-interactive --ignore-missing-imports src/terraform_issues_analyzer/

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install pytest pytest-cov

    - name: Run tests with coverage
      run: |
        pytest --cov=src/terraform_issues_analyzer --cov-report=xml --cov-report=term-missing --cov-fail-under=70 -v

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false
      continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit security linter
      run: |
        # Quote exclusion pattern to avoid shell expansion into positional args.
        bandit -r . -x './test_*.py' -f json -o bandit-report.json || true
        bandit -r . -x './test_*.py' || true

    - name: Check dependencies for vulnerabilities
      run: |
        pip install -r requirements.txt
        safety check --full-report || true
      continue-on-error: true

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Verify imports
      run: |
        python -c "from terraform_issues_analyzer.issue_classifier import IssueClassifier; print('✓ IssueClassifier')"
        python -c "from terraform_issues_analyzer.availability_checker import AvailabilityChecker; print('✓ AvailabilityChecker')"
        python -c "from terraform_issues_analyzer.github_client import GitHubClient; print('✓ GitHubClient')"
        python -c "from terraform_issues_analyzer.report_generator import ReportGenerator; print('✓ ReportGenerator')"
        python -c "from terraform_issues_analyzer.service_definitions import get_service_terms; print('✓ ServiceDefinitions')"

    - name: Build status
      run: |
        echo "✅ All checks passed!"

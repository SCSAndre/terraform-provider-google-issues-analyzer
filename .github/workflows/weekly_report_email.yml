name: Weekly Terraform Issues Report with Email

on:
  schedule:
    # Run every Friday at 12:00 PM UTC
    - cron: '0 12 * * 5'
  workflow_dispatch:

jobs:
  generate-and-email-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run issue analyzer
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python script.py

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Send email to team using Python script
      env:
        SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
        SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
        SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        EMAIL_FROM: ${{ secrets.EMAIL_FROM || secrets.SMTP_USERNAME }}
      run: |
        python3 send_team_email.py

    - name: Upload report as artifact
      uses: actions/upload-artifact@v4
      with:
        name: terraform-issues-report-${{ steps.date.outputs.date }}
        path: analysis_results/terraform_target_services_issues_report_en.md
        retention-days: 90


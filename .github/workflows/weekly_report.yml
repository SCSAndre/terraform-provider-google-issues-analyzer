name: Weekly Terraform Issues Report

on:
  schedule:
    # Run every Friday at 10:00 AM UTC
    - cron: '0 10 * * 5'
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run with debug logging'
        required: false
        default: false

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run issue analyzer
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEBUG: ${{ inputs.debug_enabled }}
      run: |
        python script.py

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Upload report as artifact
      uses: actions/upload-artifact@v4
      with:
        name: terraform-issues-report-${{ steps.date.outputs.date }}
        path: analysis_results/terraform_target_services_issues_report_en.md
        retention-days: 90

    - name: Create summary
      run: |
        echo "## 📊 Terraform Issues Report Generated" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Date:** ${{ steps.date.outputs.date }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f "analysis_results/terraform_target_services_issues_report_en.md" ]; then
          # Extract total from report
          TOTAL=$(grep -oP 'Total Issues Found:\*\* \K\d+' analysis_results/terraform_target_services_issues_report_en.md || echo "N/A")
          echo "**Total Issues Found:** $TOTAL" >> $GITHUB_STEP_SUMMARY
        fi

# =============================================================================
# Project Metadata
# =============================================================================

[project]
name = "terraform-issues-analyzer"
version = "1.0.0"
description = "Analyzes GitHub issues from Terraform Provider Google repository to identify issues relevant to specific GCP services"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "SCSAndre"}
]
maintainers = [
    {name = "SCSAndre"}
]
keywords = [
    "terraform",
    "github",
    "issues",
    "analysis",
    "gcp",
    "google-cloud",
    "machine-learning",
    "tfidf",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Bug Tracking",
    "Typing :: Typed",
]

dependencies = [
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "typing-extensions>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "bandit>=1.7.0",
    "pre-commit>=3.5.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]
email = [
    "secure-smtplib>=0.1.1",
]

[project.urls]
Homepage = "https://github.com/SCSAndre/terraform-provider-google-issues-analyzer"
Documentation = "https://github.com/SCSAndre/terraform-provider-google-issues-analyzer#readme"
Repository = "https://github.com/SCSAndre/terraform-provider-google-issues-analyzer.git"
Issues = "https://github.com/SCSAndre/terraform-provider-google-issues-analyzer/issues"
Changelog = "https://github.com/SCSAndre/terraform-provider-google-issues-analyzer/blob/main/CHANGELOG.md"

[project.scripts]
analyze-issues = "script:main"


# =============================================================================
# Build System
# =============================================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "analysis_results*"]


# =============================================================================
# Ruff Configuration (Linting & Formatting)
# =============================================================================

[tool.ruff]
# Target Python 3.11
target-version = "py311"

# Maximum line length
line-length = 100

# Exclude common directories
exclude = [
    ".git",
    ".github",
    "__pycache__",
    ".venv",
    "venv",
    "*.pyc",
    "analysis_results",
]

[tool.ruff.lint]
# Enable these rule categories
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "N",      # pep8-naming
    "D",      # pydocstyle
    "ANN",    # flake8-annotations
    "PTH",    # flake8-use-pathlib
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "SIM108", # ternary operator
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "ANN101", # missing type annotation for self
    "ANN102", # missing type annotation for cls
    "S101",   # assert detected (allowed in tests)
]

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["D", "ANN", "S"]  # Ignore docstrings and annotations in tests

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "github_client",
    "issue_classifier",
    "availability_checker",
    "report_generator",
    "service_definitions",
    "types_definitions",
    "exceptions",
    "logging_config",
    "validators",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Format docstrings
docstring-code-format = true


# =============================================================================
# MyPy Configuration (Type Checking)
# =============================================================================

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = "test_*"
disallow_untyped_defs = false


# =============================================================================
# Pytest Configuration (Testing)
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]


# =============================================================================
# Coverage Configuration
# =============================================================================

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "test_*.py",
    "__pycache__/*",
    ".venv/*",
    "venv/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "raise AssertionError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
fail_under = 80
show_missing = true


# =============================================================================
# Bandit Configuration (Security)
# =============================================================================

[tool.bandit]
exclude_dirs = ["tests", "test_*.py", ".venv", "venv"]
skips = ["B101"]  # Skip assert warning

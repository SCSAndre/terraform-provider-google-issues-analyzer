# =============================================================================
# Project Metadata
# =============================================================================

[project]
name = "terraform-issues-analyzer"
version = "1.0.0"
description = "Analyzes GitHub issues from Terraform Provider Google repository to identify issues relevant to specific GCP services"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "SCSAndre"}
]
maintainers = [
    {name = "SCSAndre"}
]
keywords = [
    "terraform",
    "github",
    "issues",
    "analysis",
    "gcp",
    "google-cloud",
    "machine-learning",
    "tfidf",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Bug Tracking",
    "Typing :: Typed",
]

dependencies = [
    "requests>=2.31.0",
    "scikit-learn>=1.5.0",
    "tenacity>=9.0.0",
    "typing-extensions>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "mypy>=1.5.0",
    "bandit>=1.7.0",
    "pre-commit>=3.5.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]
email = []
gcp = [
    "google-cloud-secret-manager>=2.23.0",
]

[project.urls]
Homepage = "https://github.com/SCSAndre/terraform-provider-google-issues-analyzer"
Documentation = "https://github.com/SCSAndre/terraform-provider-google-issues-analyzer#readme"
Repository = "https://github.com/SCSAndre/terraform-provider-google-issues-analyzer.git"
Issues = "https://github.com/SCSAndre/terraform-provider-google-issues-analyzer/issues"
Changelog = "https://github.com/SCSAndre/terraform-provider-google-issues-analyzer/blob/main/CHANGELOG.md"

[project.scripts]
analyze-issues = "terraform_issues_analyzer.cli:main"
evaluate-classifier-quality = "terraform_issues_analyzer.offline_evaluator:main"


# =============================================================================
# Build System
# =============================================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["terraform_issues_analyzer*"]
exclude = ["tests*"]


# =============================================================================
# Ruff Configuration (Linting & Formatting)
# =============================================================================

[tool.ruff]
# Target Python 3.11
target-version = "py311"

# Maximum line length
line-length = 100

# Exclude common directories
exclude = [
    ".git",
    ".github",
    "__pycache__",
    ".venv",
    "venv",
    "*.pyc",
    "analysis_results",
]

[tool.ruff.lint]
# Enable these rule categories
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "N",      # pep8-naming
    "D",      # pydocstyle
    "ANN",    # flake8-annotations
    "PTH",    # flake8-use-pathlib
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "SIM108", # ternary operator
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "D107",   # missing docstring in __init__
    "D212",   # multi-line docstring summary location
    "ANN101", # missing type annotation for self
    "ANN102", # missing type annotation for cls
    "ANN204", # missing return annotation for special methods
    "S101",   # assert detected (allowed in tests)
    "UP006",  # keep legacy typing generics style for consistency
    "UP045",  # keep Optional style for consistency
    "W293",   # ignore blank-line whitespace in long embedded HTML strings
]

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = ["D", "ANN", "S"]  # Ignore docstrings and annotations in tests

[tool.ruff.lint.isort]
known-first-party = [
    "terraform_issues_analyzer",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Format docstrings
docstring-code-format = true


# =============================================================================
# MyPy Configuration (Type Checking)
# =============================================================================

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false


# =============================================================================
# Pytest Configuration (Testing)
# =============================================================================

[tool.pytest.ini_options]
addopts = "--cov=src/terraform_issues_analyzer --cov-report=term-missing --cov-fail-under=80 -v"
testpaths = ["tests"]


# =============================================================================
# Coverage Configuration
# =============================================================================

[tool.coverage.run]
source = ["src/terraform_issues_analyzer"]
branch = true
omit = [
    "tests/*",
    "__pycache__/*",
    ".venv/*",
    "venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "raise AssertionError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
fail_under = 80
show_missing = true


# =============================================================================
# Bandit Configuration (Security)
# =============================================================================

[tool.bandit]
exclude_dirs = ["tests", "test_*.py", ".venv", "venv"]
skips = ["B101"]  # Skip assert warning
